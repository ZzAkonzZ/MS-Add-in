<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Controls Add-in Test</title>
    <link rel="stylesheet" href="style.css">
    <!-- Скрипт инициализации Office.js -->
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- MSAL (локальная копия @azure/msal-browser 4.12.0) — нужна только для входа через Entra ID (NAA) -->
    <script src="lib/msal-browser.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h3>Project Controls</h3>
            <span class="badge">PoC Test</span>
        </header>

        <main>
            <p class="description">Проверка среды выполнения и контекста учетной записи:</p>

            <button id="btnCheckProfile" class="btn-primary">Получить профиль</button>

            <div id="outputCard" class="card hidden">
                <div class="field">
                    <label>ФИО:</label>
                    <div id="userName" class="value">—</div>
                </div>
                <div class="field">
                    <label>Почта:</label>
                    <div id="userEmail" class="value">—</div>
                </div>
                <div class="field">
                    <label>Источник:</label>
                    <div id="userSource" class="value">—</div>
                </div>
                <div class="field">
                    <label>Хост / платформа:</label>
                    <div id="userPlatform" class="value">—</div>
                </div>
                <div class="field">
                    <label>Диагностика:</label>
                    <div id="diagLog" class="value code-block">—</div>
                </div>
            </div>

            <div id="manualForm" class="card hidden">
                <div class="field">
                    <label for="manualName">ФИО:</label>
                    <input id="manualName" type="text" autocomplete="name">
                </div>
                <div class="field">
                    <label for="manualEmail">Почта:</label>
                    <input id="manualEmail" type="email" autocomplete="email">
                </div>
                <button id="btnSaveManual" class="btn-primary">Сохранить</button>
            </div>

            <div id="statusMessage" class="status"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
